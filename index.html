<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TryPad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>📝 Pages</h1>
      <button class="btn-icon" id="btnNewRoot" title="New page" disabled>＋</button>
    </div>
    <div class="folder-bar">
      <span class="folder-name" id="folderName">No folder selected</span>
      <button id="btnChooseFolder">Folder</button>
    </div>
    <div class="search-bar">
      <input type="search" id="searchInput" placeholder="Search pages…" autocomplete="off" />
    </div>
    <div class="notes-list" id="notesList"></div>
    <div class="sidebar-resizer" id="sidebarResizer" title="Drag to resize"></div>
  </aside>

  <main class="main">
    <div class="toolbar" id="toolbar" style="display: none;">
      <button type="button" data-cmd="bold" title="Bold">𝐁</button>
      <button type="button" data-cmd="italic" title="Italic">𝐼</button>
      <button type="button" data-cmd="strikeThrough" title="Strikethrough">S̶</button>
      <div class="divider"></div>
      <button type="button" data-cmd="formatBlock" data-value="h1">H1</button>
      <button type="button" data-cmd="formatBlock" data-value="h2">H2</button>
      <button type="button" data-cmd="formatBlock" data-value="h3">H3</button>
      <button type="button" data-cmd="formatBlock" data-value="p">P</button>
      <div class="divider"></div>
      <button type="button" data-cmd="insertUnorderedList">• List</button>
      <button type="button" data-cmd="insertOrderedList">1. List</button>
      <button type="button" data-cmd="formatBlock" data-value="blockquote">“ Quote</button>
      <div class="divider"></div>
      <button type="button" id="btnTable">▦ Table</button>
      <div class="divider"></div>
      <button type="button" data-cmd="removeFormat">✕ Clear</button>
      <div class="divider"></div>
      <label>🖼 Image<input type="file" id="imageInput" accept="image/*" hidden /></label>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <div class="editor-area" id="editorArea">
      <div class="empty-state" id="emptyState">
        <h2>No page selected</h2>
        <p>Select a page from the sidebar or create a new one.</p>
      </div>
      <div id="editorContent" style="display: none;">
        <input type="text" class="title-input" id="titleInput" placeholder="Untitled" autocomplete="off" />
        <div id="editor" contenteditable="true"
             data-placeholder="Type here…  Try:  - + space  for bullet,  # + space  for heading"
             spellcheck="true"></div>
      </div>
    </div>

    <div class="no-folder-overlay" id="noFolderOverlay">
      <h2 id="overlayTitle">Choose a folder to store your notes</h2>
      <p id="overlayDesc">
        Each page is saved as a Markdown (<code>.md</code>) file on your computer.<br>
        Sub-pages become folders inside the parent page.<br><br>
        Use <strong>Chrome</strong> or <strong>Edge</strong>
      </p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
        <button id="btnReconnect" style="display:none;background:#0f7b0f;">Reconnect last folder</button>
        <button id="btnChooseFolderMain">Select Folder…</button>
      </div>
    </div>

    <div class="table-toolbar" id="tableToolbar">
      <button type="button" data-table="add-row">＋ Row</button>
      <button type="button" data-table="del-row">− Row</button>
      <span class="sep"></span>
      <button type="button" data-table="add-col">＋ Col</button>
      <button type="button" data-table="del-col">− Col</button>
    </div>
  </main>
  <script src="app1.js"></script>
  <script src="app2.js"></script>
</body>
</html>
